services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TRACELENS_DB_PATH: /var/lib/tracelens/tracelens.sqlite3
      TRACELENS_CORS_ORIGINS: ${TRACELENS_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TRACELENS_MAX_UPLOAD_BYTES: ${TRACELENS_MAX_UPLOAD_BYTES:-26214400}
    volumes:
      - tracelens-db:/var/lib/tracelens
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  frontend:
    build: ./frontend
    environment:
      TRACELENS_MAX_UPLOAD_BYTES: ${TRACELENS_MAX_UPLOAD_BYTES:-26214400}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  tracelens-db:

